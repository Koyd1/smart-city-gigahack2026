[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chisinau-civic-parser"
version = "0.1.0"
description = "Structure-preserving parser for Chisinau municipal sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "docling>=2.0,<3",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "lingua-language-detector>=2.1,<3",
  "pypdf>=5,<7",
  "scrapy>=2.13,<3",
  "trafilatura>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
civic-parser = "civic_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
